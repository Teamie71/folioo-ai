have_fun: false

memory_config:
    disabled: false

code_review:
    disable: false
    comment_severity_threshold: MEDIUM
    max_review_comments: 15
    pull_request_opened:
        help: true
        summary: false
        code_review: false
        include_drafts: true

ignore_patterns:
    - ".venv/**"
    - ".pytest_cache/**"
    - ".ruff_cache/**"
    - ".langgraph_api/**"
    - ".data/**"
    - ".for_local/**"
    - ".agent/**"
    - "**/__pycache__/**"
    - "**/*.egg-info/**"
    - "**/*.sqlite"
    - "**/*.sqlite-shm"
    - "**/*.sqlite-wal"
