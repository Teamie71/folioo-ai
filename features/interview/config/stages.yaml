stages:
    1:
        name: "프로젝트 개요 및 구조화"
        description: "프로젝트의 배경, 목표, 팀 구성 등 기본 맥락을 파악합니다."
        fixed_questions:
            - "반가워요! [경험명]의 경험 정리를 시작해볼게요. 가장 먼저 이 활동을 시작하게 된 계기가 궁금해요. 이 활동을 통해 중점적으로 해결해야 하는 과제가 있었나요? 언제부터 언제까지 활동했는지, 구체적인 진행 기간도 알려주세요."
            - "혼자 진행했는지, 팀으로 진행한 활동인지도 궁금해요. 팀원은 몇 명이었고, 그 중에서 본인은 어떤 역할을 맡았나요? 공식적인 직책이 없어도 괜찮아요! 본인이 주로 맡았던 포지션을 알려주세요."
            - "좋아요. 이 프로젝트의 타깃이 되는 고객이나 대상이 있었나요? 누가 봐주거나 이용했으면 좋겠다고 생각했나요?"
        required_fields:
            project_background:
                description: "이 활동을 시작하게 된 이유"
            problem_definition:
                description: "프로젝트의 최종 목표 또는 해결하려던 미션"
            message_or_concept:
                description: "(창작물의 경우) 결과물을 통해 전달하고자 한 핵심 주제"
            project_duration:
                description: "프로젝트 진행 기간 (YYYY.MM.DD ~ YYYY.MM.DD)"
            team_composition:
                description: "전체 참여 인원 수와 본인의 포지션"
            target_audience:
                description: "결과물 또는 활동의 예상 사용자, 수혜자 또는 구체적인 페르소나"
        max_generated_questions: 0
        force_all_generated_questions: false

    2:
        name: "구체적 실행 과정"
        description: "수행한 핵심 업무와 사용한 기술 및 도구를 상세히 수집합니다."
        fixed_questions:
            - "이제 본격적으로 어떤 일을 하셨는지 들어보고 싶어요. 진행 과정에서 가장 공들여서 했던 핵심 업무 3~4가지를 꼽는다면 무엇인가요? 구체적으로 어떤 업무들을 했는지 이야기해 주세요."
            - "그 업무들을 해내기 위해 어떤 도구들을 사용했나요? 디자인툴, 협업툴, 기술 스택, 방법론 등 사용한 기술을 모두 자랑해 주세요!"
        required_fields:
            work_categories:
                description: "2개 이상의 업무 카테고리 (리스트)"
        max_generated_questions: 0
        force_all_generated_questions: false

    3:
        name: "문제 해결과 논리"
        description: "직면한 문제와 해결 과정, 의사결정의 논리를 탐색합니다."
        fixed_questions:
            - "프로젝트를 하다 보면 꼭 예상치 못한 문제를 만나게 되죠. 진행하면서 가장 식은땀 났던 순간이나 어려웠던 점은 무엇이었나요? 당시 상황을 생생하게 들려주세요."
            - "오, 쉽지 않은 상황이었겠네요. 그 문제를 해결하기 위해 구체적으로 어떤 행동을 했고, 어떻게 대처했는지 궁금해요."
            - "제일 중요한 궁금증이 생겼어요! 여러 방법이 있었을 텐데, 왜 하필 그 방법으로 해결하려고 했나요? 그때 머릿속으로 했던 고민이나 판단의 이유를 알려주세요."
        required_fields:
            problem_episodes:
                description: "2개 이상의 에피소드 (리스트)"
        max_generated_questions: 0
        force_all_generated_questions: false

    4:
        name: "성과 및 회고"
        description: "프로젝트의 결과와 개인적 성장, 향후 계획을 정리합니다."
        fixed_questions:
            - "활동을 위해 정말 열심히 노력하셨던 게 느껴지는데, 최종 결과는 어땠나요? 혹시 수상이나 등수 같은 수치적인 성과도 있었나요? 아니면 주변 사람들의 기억에 남는 피드백이 있었다면 그것도 알려주세요."
            - "뿌듯하셨겠어요. 개인적인 성장도 궁금하네요. 이 경험을 하기 전의 나와 지금의 나, 비교해 보면 어떤 점이 달라진 것 같나요? 가장 크게 성장했다고 느끼는 점이나, 업무를 대하는 태도에서 배운 점이 있다면 들려주세요."
            - "개인적으로도 많은 성장이 있었군요. 만약 이 프로젝트를 다시 한다면, '이것만큼은 더 잘해보고 싶다' 하는 아쉬움이나, 향후 계획이 있나요? 앞으로 더 공부하고 싶은 내용이나 분야가 있다면 그것도 알려주세요."
        required_fields:
            final_deliverable:
                description: "프로젝트의 최종 상태 (완성, 런칭, 제출, 수상 여부 등)"
            quantitative_results:
                description: "수치로 증명 가능한 결과 (등수, 달성률, 참여자 수, 다운로드 수 등)"
            qualitative_results:
                description: "타인의 평가, 피드백 인용, 체감 반응 등 비수치적 결과"
            personal_growth:
                description: "경험 전후 달라진 직무 역량 및 태도"
            insights_gained:
                description: "대상, 관계 또는 해당 업무나 산업에 대해 새롭게 얻은 관점"
            future_plans:
                description: "아쉬웠던 점을 보완하기 위한 구체적인 개선 방향 또는 학습 계획"
        max_generated_questions: 0
        force_all_generated_questions: false

# 전역 설정 (임시)
global_config:
    max_retries_per_question: 2 # 질문당 최대 재시도 횟수
    enable_dynamic_followup: true # 동적 후속 질문 활성화
    context_window_size: 5 # 컨텍스트로 참조할 이전 답변 개수
    extension_turns_per_session: 18 # 추가 대화 1회당 AI 질문 횟수
    max_extensions: 1 # 최대 추가 대화 횟수
    additional_question_priorities:
        - priority: 1
          targets:
              - target: "stage_3_episode_1_strategy_rationale"
                stage: 3
                field_name: "problem_episodes"
                label: "Episode 1 해결 전략과 선택 근거"
                question_hint: "첫 번째 문제 상황에서 어떤 해결 전략을 선택했고 왜 그 방법을 선택했는지 구체적으로 확인한다."
                field_description: "첫 번째 문제 에피소드의 상황, 해결 행동, 선택한 전략의 이유가 함께 드러나야 한다."
              - target: "stage_3_episode_2_strategy_rationale"
                stage: 3
                field_name: "problem_episodes"
                label: "Episode 2 해결 전략과 선택 근거"
                question_hint: "두 번째 문제 상황에서 어떤 해결 전략을 선택했고 왜 그 방법을 선택했는지 구체적으로 확인한다."
                field_description: "두 번째 문제 에피소드의 상황, 해결 행동, 선택한 전략의 이유가 함께 드러나야 한다."
              - target: "stage_4_quantitative_result_1"
                stage: 4
                field_name: "quantitative_results"
                label: "정량적 성과 1"
                question_hint: "성과를 수치, 등수, 달성률, 참여자 수, 다운로드 수처럼 객관적으로 드러낼 수 있는 정보를 확인한다."
                field_description: "첫 번째 정량 성과가 구체적인 수치와 맥락을 포함해야 한다."
              - target: "stage_4_insight"
                stage: 4
                field_name: "insights_gained"
                label: "인사이트"
                question_hint: "이 경험을 통해 대상, 관계, 업무 또는 산업에 대해 새롭게 알게 된 관점을 확인한다."
                field_description: "경험 이후 새롭게 얻은 관점이나 판단 기준이 구체적으로 드러나야 한다."
        - priority: 2
          targets:
              - target: "stage_2_work_category_1_intent_tools"
                stage: 2
                field_name: "work_categories"
                label: "업무 대분류 1 업무 의도와 사용 도구/기술"
                question_hint: "첫 번째 핵심 업무를 왜 수행했는지와 어떤 도구나 기술을 사용했는지 확인한다."
                field_description: "첫 번째 업무 카테고리의 수행 의도와 사용한 도구/기술이 함께 드러나야 한다."
              - target: "stage_2_work_category_2_intent_tools"
                stage: 2
                field_name: "work_categories"
                label: "업무 대분류 2 업무 의도와 사용 도구/기술"
                question_hint: "두 번째 핵심 업무를 왜 수행했는지와 어떤 도구나 기술을 사용했는지 확인한다."
                field_description: "두 번째 업무 카테고리의 수행 의도와 사용한 도구/기술이 함께 드러나야 한다."
              - target: "stage_4_personal_growth"
                stage: 4
                field_name: "personal_growth"
                label: "성장한 점"
                question_hint: "경험 전후로 달라진 역량, 태도, 일하는 방식의 변화를 확인한다."
                field_description: "사용자가 어떤 면에서 성장했는지와 그 변화가 경험과 어떻게 연결되는지 드러나야 한다."
              - target: "stage_4_quantitative_result_2"
                stage: 4
                field_name: "quantitative_results"
                label: "정량적 성과 2"
                question_hint: "추가로 제시할 수 있는 두 번째 수치 기반 성과를 확인한다."
                field_description: "두 번째 정량 성과가 구체적인 수치와 맥락을 포함해야 한다."
        - priority: 3
          targets:
              - target: "stage_4_future_plan"
                stage: 4
                field_name: "future_plans"
                label: "향후 계획"
                question_hint: "아쉬웠던 점을 보완하기 위한 구체적인 개선 방향이나 앞으로의 학습 계획을 확인한다."
                field_description: "향후 개선 방향이나 학습 계획이 구체적인 행동으로 드러나야 한다."
              - target: "stage_1_problem_definition"
                stage: 1
                field_name: "problem_definition"
                label: "해결하고자 한 문제 정의"
                question_hint: "프로젝트가 해결하려던 문제나 최종 목표를 명확히 확인한다."
                field_description: "해결하려던 문제, 목표, 미션이 명확하게 설명되어야 한다."
              - target: "stage_1_team_role"
                stage: 1
                field_name: "team_composition"
                label: "팀 구성 및 본인 역할"
                question_hint: "팀 규모, 협업 구조, 본인이 맡은 역할과 책임 범위를 확인한다."
                field_description: "전체 참여 인원과 사용자의 포지션, 주요 책임이 함께 드러나야 한다."
              - target: "stage_4_qualitative_result_1"
                stage: 4
                field_name: "qualitative_results"
                label: "정성적 성과 1"
                question_hint: "타인의 평가, 피드백, 체감 반응처럼 수치가 아닌 성과를 확인한다."
                field_description: "첫 번째 정성 성과가 구체적인 피드백이나 반응과 함께 드러나야 한다."
              - target: "stage_2_work_category_1_core_tasks"
                stage: 2
                field_name: "work_categories"
                label: "업무 대분류 1 핵심 수행 업무"
                question_hint: "첫 번째 핵심 업무에서 실제로 수행한 세부 작업을 확인한다."
                field_description: "첫 번째 업무 카테고리의 핵심 수행 내용이 구체적인 행동 단위로 드러나야 한다."
              - target: "stage_2_work_category_2_core_tasks"
                stage: 2
                field_name: "work_categories"
                label: "업무 대분류 2 핵심 수행 업무"
                question_hint: "두 번째 핵심 업무에서 실제로 수행한 세부 작업을 확인한다."
                field_description: "두 번째 업무 카테고리의 핵심 수행 내용이 구체적인 행동 단위로 드러나야 한다."
              - target: "stage_4_qualitative_result_2"
                stage: 4
                field_name: "qualitative_results"
                label: "정성적 성과 2"
                question_hint: "추가로 제시할 수 있는 두 번째 정성적 성과나 피드백을 확인한다."
                field_description: "두 번째 정성 성과가 구체적인 피드백이나 반응과 함께 드러나야 한다."
        - priority: 4
          targets:
              - target: "stage_1_project_background"
                stage: 1
                field_name: "project_background"
                label: "시작 배경 및 계기"
                question_hint: "이 활동을 시작하게 된 배경과 계기를 확인한다."
                field_description: "활동을 시작한 이유와 당시 맥락이 구체적으로 드러나야 한다."
              - target: "stage_1_message_or_concept"
                stage: 1
                field_name: "message_or_concept"
                label: "메시지 또는 콘셉트"
                question_hint: "창작물이나 결과물을 통해 전달하려던 핵심 메시지 또는 콘셉트를 확인한다."
                field_description: "결과물의 핵심 주제, 메시지, 콘셉트가 명확하게 드러나야 한다."
              - target: "stage_4_final_deliverable"
                stage: 4
                field_name: "final_deliverable"
                label: "최종 결과물 상태"
                question_hint: "프로젝트의 최종 상태, 완성/런칭/제출/수상 여부를 확인한다."
                field_description: "프로젝트가 어떤 상태로 마무리되었는지와 결과물의 형태가 명확해야 한다."
