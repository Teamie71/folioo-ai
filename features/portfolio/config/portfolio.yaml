# 포트폴리오 생성 설정

# 섹션별 검증 규칙
sections:
    detail_info:
        description: "상세정보 — 프로젝트 배경, 목표, 팀 구성 등을 서술형으로 작성"
        min_length: 100
        required: true
    assigned_task:
        description: "담당업무 — 본인이 수행한 핵심 업무와 사용 기술을 서술형으로 작성"
        min_length: 100
        required: true
    problem_solving:
        description: "문제해결 — 직면한 문제와 해결 과정, 의사결정 논리를 서술형으로 작성"
        min_length: 100
        required: true
    lessons_learned:
        description: "배운 점 — 성과, 개인적 성장, 향후 계획을 서술형으로 작성"
        min_length: 100
        required: true

# LLM 호출 설정
llm:
    temperature: 0.7
    max_retries: 3

# collected_data → 섹션 매핑 규칙
# 인터뷰에서 수집된 데이터를 포트폴리오 섹션에 매핑
section_mapping:
    detail_info:
        - "stage_1" # 프로젝트 개요 및 구조화
    assigned_task:
        - "stage_2" # 구체적 실행 과정
    problem_solving:
        - "stage_3" # 문제 해결과 논리
    lessons_learned:
        - "stage_4" # 성과 및 회고
