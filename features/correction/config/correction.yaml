# 첨삭 생성 설정

# LLM 호출 설정
llm:
    model: "openai/gpt-oss-120b"
    temperature: 0.2
    timeout: 300

# 출력 검증 규칙
validation:
    min_lines_per_field: 1
    max_retries: 2
    allow_null_comment_for_keep: true

# RAG 검색 규칙
rag:
    keyword_count: 6
    max_results_per_keyword: 5
    company_insight_max_length: 2000
    call_max_retries: 3
    length_retry_max_retries: 2
