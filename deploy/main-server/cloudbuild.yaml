steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_IMAGE_URI}
      - .
images:
  - ${_IMAGE_URI}
substitutions:
  _IMAGE_URI: asia-northeast3-docker.pkg.dev/$PROJECT_ID/folioo-ai/main-server:latest
options:
  logging: CLOUD_LOGGING_ONLY
